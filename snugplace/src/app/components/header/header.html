<!-- header.html -->
<header class="navbar-snug" [class.scrolled]="isScrolled">
  <div class="nav-container">
    
    <!-- Logo -->
    <a routerLink="" class="logo">
      <span class="material-symbols-rounded">globe_location_pin</span>
      <span>{{ title() }}</span>
    </a>

    <!-- Navegación Desktop -->
    <ul class="nav-links desktop-nav">
      <li><a routerLink="/my-places" class="nav-link-snug">Gestión alojamientos</a></li>
      <li><a routerLink="/bookings" class="nav-link-snug">Mis reservas</a></li>
    </ul>

    <!-- Botones de acción -->
    <div class="nav-actions">
      <button routerLink="/login" class="btn-outline-snug">Login</button>
      <button routerLink="/register" class="btn-primary-snug">Crear cuenta</button>
    </div>

    <!-- Menú móvil (hamburguesa) -->
    <button class="menu-toggle" (click)="toggleMenu()">
      <span class="material-symbols-rounded">{{ menuOpen ? 'close' : 'menu' }}</span>
    </button>

  </div>

  <!-- Menú móvil desplegable -->
  <div class="mobile-menu" [class.active]="menuOpen">
    <ul class="mobile-nav-links">
      <li><a routerLink="/my-places" (click)="closeMenu()">Gestión Alojamientos</a></li>
      <li><a routerLink="/bookings" (click)="closeMenu()">Mis reservas</a></li>
      <li><a routerLink="/login" (click)="closeMenu()">Login</a></li>
      <li><a routerLink="/register" (click)="closeMenu()">Crear cuenta</a></li>
    </ul>
  </div>
</header>
