<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dejar Comentario - SnugPlace</title>
  <link rel="stylesheet" href="comments-accommodation.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="comentario-container">
    <div class="comentario-card">
      <h3>Deja tu comentario</h3>
      <p class="alojamiento-titulo" id="accommodationName">Hermoso apartamento en el centro de Medellín</p>
        
      <form id="commentForm" class="comment-form" novalidate>
        <div class="form-group">
          <label class="form-label">Calificación *</label>
          <div class="estrellas-container">
            <div class="estrellas" id="starsContainer">
              <!-- Las estrellas se generarán con JavaScript -->
            </div>
            <span class="calificacion-texto" id="ratingText" style="display: none;"></span>
          </div>
          <div class="error-message" id="calificationError"></div>
        </div>

        <div class="form-group">
          <label for="comentario" class="form-label">Tu opinión *</label>
          <textarea 
            id="comentario" 
            name="comment" 
            class="form-control"
            rows="5"
            placeholder="Cuéntanos sobre tu experiencia en este alojamiento..."
            required></textarea>
          <small class="char-count">
            <span id="charCount">0</span> / 500 caracteres
          </small>
          <div class="error-message" id="commentError"></div>
        </div>

        <div class="alert alert-success" id="successMessage" style="display: none;">
          <span class="material-symbols-rounded icon">check_circle</span>
          <span id="successText"></span>
        </div>

        <div class="alert alert-error" id="errorMessage" style="display: none;">
          <span class="material-symbols-rounded icon">error</span>
          <span id="errorText"></span>
        </div>

        <button 
          type="submit" 
          class="btn btn-primary"
          id="submitButton">
          <span class="btn-content">
            <span class="material-symbols-rounded icon">send</span>
            Publicar comentario
          </span>
          <span class="btn-loading" style="display: none;">
            <span class="spinner"></span> Publicando...
          </span>
        </button>
      </form>
    </div>
  </div>

  <script>
    // Estado de la aplicación
    let currentRating = 0;
    let hoverRating = 0;
    let loading = false;

    // Datos de ejemplo
    const booking = {
      accommodationName: "Hermoso apartamento en el centro de Medellín"
    };

    // Inicializar la página
    document.addEventListener('DOMContentLoaded', function() {
      // Cargar datos
      document.getElementById('accommodationName').textContent = booking.accommodationName;
      
      // Generar estrellas
      generateStars();
      
      // Event listeners
      document.getElementById('comentario').addEventListener('input', updateCharCount);
      document.getElementById('commentForm').addEventListener('submit', handleSubmit);
      
      // Validación en tiempo real
      document.getElementById('comentario').addEventListener('blur', validateComment);
    });

    // Generar las estrellas dinámicamente
    function generateStars() {
      const starsContainer = document.getElementById('starsContainer');
      starsContainer.innerHTML = '';
      
      for (let i = 1; i <= 5; i++) {
        const star = document.createElement('span');
        star.className = 'material-symbols-rounded star';
        star.textContent = 'star';
        star.dataset.rating = i;
        
        star.addEventListener('click', () => setRating(i));
        star.addEventListener('mouseenter', () => onCalificationHover(i));
        star.addEventListener('mouseleave', resetHover);
        
        starsContainer.appendChild(star);
      }
      
      updateStarsDisplay();
    }

    // Funciones de calificación
    function setRating(rating) {
      currentRating = rating;
      updateStarsDisplay();
      updateRatingText();
      clearFieldError('calificationError');
    }

    function onCalificationHover(rating) {
      hoverRating = rating;
      updateStarsDisplay();
    }

    function resetHover() {
      hoverRating = 0;
      updateStarsDisplay();
    }

    function getCalificationShown() {
      return hoverRating || currentRating;
    }

    function updateStarsDisplay() {
      const stars = document.querySelectorAll('.star');
      const ratingToShow = getCalificationShown();
      
      stars.forEach(star => {
        const starRating = parseInt(star.dataset.rating);
        if (starRating <= ratingToShow) {
          star.classList.add('filled');
          star.classList.remove('empty');
        } else {
          star.classList.add('empty');
          star.classList.remove('filled');
        }
      });
    }

    function updateRatingText() {
      const ratingText = document.getElementById('ratingText');
      if (currentRating > 0) {
        ratingText.textContent = `${currentRating} de 5 estrellas`;
        ratingText.style.display = 'block';
      } else {
        ratingText.style.display = 'none';
      }
    }

    // Funciones de utilidad
    function updateCharCount() {
      const textarea = document.getElementById('comentario');
      const charCount = textarea.value.length;
      document.getElementById('charCount').textContent = charCount;
    }

    function validateComment() {
      const comment = document.getElementById('comentario');
      if (!comment.value.trim() && comment.hasAttribute('required')) {
        showFieldError('commentError', 'La opinión es obligatoria');
        comment.classList.add('is-invalid');
      } else if (comment.value.trim().length < 10) {
        showFieldError('commentError', 'La opinión debe tener al menos 10 caracteres');
        comment.classList.add('is-invalid');
      } else {
        clearFieldError('commentError');
        comment.classList.remove('is-invalid');
      }
    }

    function validateRating() {
      if (currentRating === 0) {
        showFieldError('calificationError', 'La calificación es obligatoria');
        return false;
      }
      clearFieldError('calificationError');
      return true;
    }

    // Manejo de errores y mensajes
    function showFieldError(elementId, message) {
      const errorElement = document.getElementById(elementId);
      errorElement.textContent = message;
      errorElement.style.display = 'block';
    }

    function clearFieldError(elementId) {
      const errorElement = document.getElementById(elementId);
      errorElement.textContent = '';
      errorElement.style.display = 'none';
    }

    function showError(message) {
      const errorElement = document.getElementById('errorMessage');
      document.getElementById('errorText').textContent = message;
      errorElement.style.display = 'flex';
      document.getElementById('successMessage').style.display = 'none';
    }

    function showSuccess(message) {
      const successElement = document.getElementById('successMessage');
      document.getElementById('successText').textContent = message;
      successElement.style.display = 'flex';
      document.getElementById('errorMessage').style.display = 'none';
    }

    function hideAlerts() {
      document.getElementById('errorMessage').style.display = 'none';
      document.getElementById('successMessage').style.display = 'none';
    }

    // Manejo del envío del formulario
    function handleSubmit(event) {
      event.preventDefault();
      hideAlerts();
      
      // Validar campos
      const isRatingValid = validateRating();
      validateComment();
      
      const comment = document.getElementById('comentario');
      const isCommentValid = comment.value.trim().length >= 10;
      
      if (!isRatingValid || !isCommentValid) {
        showError('Por favor, completa todos los campos obligatorios correctamente');
        return;
      }
      
      // Simular envío
      simulateCommentSubmission();
    }

    function simulateCommentSubmission() {
      const submitButton = document.getElementById('submitButton');
      const btnContent = document.querySelector('.btn-content');
      const btnLoading = document.querySelector('.btn-loading');
      
      // Mostrar estado de carga
      loading = true;
      btnContent.style.display = 'none';
      btnLoading.style.display = 'flex';
      submitButton.disabled = true;
      
      // Simular llamada a la API
      setTimeout(() => {
        // Simular éxito (90% de las veces)
        if (Math.random() > 0.1) {
          showSuccess('¡Comentario publicado exitosamente! Gracias por tu opinión.');
          
          // Resetear formulario
          document.getElementById('commentForm').reset();
          currentRating = 0;
          hoverRating = 0;
          updateStarsDisplay();
          updateRatingText();
          updateCharCount();
        } else {
          showError('Error al publicar el comentario. Por favor, intenta nuevamente.');
        }
        
        // Restaurar botón
        loading = false;
        btnContent.style.display = 'flex';
        btnLoading.style.display = 'none';
        submitButton.disabled = false;
      }, 2000);
    }
  </script>
</body>
</html>
