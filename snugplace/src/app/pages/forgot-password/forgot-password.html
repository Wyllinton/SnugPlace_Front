<div class="container pt-5 pb-5">
    <div class="card recovery-card">
        <div class="card-body">
            <!-- Header -->
            <div class="text-center mb-4">
                <span class="material-symbols-rounded filled fs-1 text-success mb-3">lock_reset</span>
                <h2 class="card-title recovery-title">Recuperar Contraseña</h2>
                <p class="text-muted recovery-subtitle">
                    Ingresa tu correo electrónico y te enviaremos un código de recuperación.
                </p>
            </div>

            <!-- Formulario -->
            <form [formGroup]="recoveryForm" (ngSubmit)="onSubmit()" novalidate>
                <div class="form-group mb-4">
                    <label for="email" class="form-label fw-semibold">Correo Electrónico</label>
                    <input 
                        type="email" 
                        class="form-control" 
                        id="email"
                        formControlName="email"
                        [class.is-invalid]="isFieldInvalid('email')"
                        placeholder="tu@correo.com"
                    >
                    @if (isFieldInvalid('email')) {
                        <div class="invalid-feedback">
                            {{ getFieldError('email') }}
                        </div>
                    }
                </div>
                
                <!-- Botón de enviar -->
                <div class="d-grid">
                    <button 
                        type="submit" 
                        class="btn btn-success btn-lg d-flex align-items-center justify-content-center gap-2"
                        [disabled]="recoveryForm.invalid || isSubmitting"
                    >
                        <span class="material-symbols-rounded" *ngIf="!isSubmitting">send</span>
                        <div class="spinner-border spinner-border-sm" *ngIf="isSubmitting" role="status">
                            <span class="visually-hidden">Enviando...</span>
                        </div>
                        {{ isSubmitting ? 'Enviando código...' : 'Enviar Código' }}
                    </button>
                </div>
            </form>

            <!-- Enlace de volver al login -->
            <div class="text-center mt-4">
                <a routerLink="/login" class="text-decoration-none text-success">
                    <span class="material-symbols-rounded" style="font-size: 1rem;">arrow_back</span>
                    Volver al inicio de sesión
                </a>
            </div>
        </div>
    </div>
</div>
